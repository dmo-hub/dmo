name: refresh

# Manual-only (no schedule). Re-runs the cloud-safe half of the pipeline on a
# GitHub runner and, if anything changed, opens a PR for review — it never
# pushes to main directly.
#
# The step list lives in tools/refresh.py (single source — this workflow used
# to duplicate it and drifted whenever a builder was added). Flags used here:
#   --servers kr,th  KR/TH fetch legs only. The NA full crawl (scan_decks,
#                    1400+ posts) stays local; NA data keeps what's committed.
#   --no-images      image extractors download binaries into docs/img —
#                    skipped so PRs stay reviewable.
#   --no-validate    validate runs as its own step below with --no-build
#                    (the runner's empty cache makes the idempotency pass
#                    meaningless here).
# enrich_digimon_attributes (Chrome CDP past Cloudflare) is not in refresh.py
# at all — always local.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run the cloud-safe pipeline
        run: python tools/refresh.py --servers kr,th --no-images --no-validate --keep-going

      - name: Validate before proposing changes
        run: python tools/validate.py --no-build

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: scheduled data refresh"
          title: "Data refresh"
          body: |
            Automated refresh of the cloud-safe pipeline (seal tables + KR/TH
            digimon references) via `tools/refresh.py --servers kr,th
            --no-images`. Review the diff before merging — Pages publishes
            from `main`.

            Not included (run locally): the NA full crawl, attribute
            enrichment (CDP), and image extraction.
          branch: auto/data-refresh
          delete-branch: true
          add-paths: |
            data/
            docs/
