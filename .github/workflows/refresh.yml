name: refresh

# Manual-only (no schedule). Re-runs the cloud-safe half of the pipeline on a
# GitHub runner and, if anything changed, opens a PR for review — it never
# pushes to main directly.
#
# What runs here (network = plain HTTPS, safe on a Linux runner):
#   Seal:    extract_seal_tables -> build_th_seal_en -> build_seal_tables
#   Digimon: fetch_kr/th index -> scan_kr/th releases -> enrich_kr/th
#            -> enrich_gameking -> build_digimon_html
#
# What is deliberately NOT run here:
#   * scanners/scan_digimon.py   — destructive; rewrites scan_result_digimon.json
#                                  and wipes hand-curated fields (see CLAUDE.md).
#   * enrich_digimon_attributes  — needs a Chrome CDP session past Cloudflare;
#                                  cannot run headless on a cloud runner.
#   * extractors/extract_*_images — download binaries into docs/img; left to a
#                                  local run so PRs stay reviewable.
# Attributes/images therefore keep whatever is already committed.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Seal pipeline (fetches missing posts live, then builds)
        run: |
          python builders/extract_seal_tables.py
          python builders/build_th_seal_en.py
          python builders/build_seal_tables.py

      - name: Digimon — refresh KR/TH references and rebuild page
        run: |
          python fetchers/fetch_kr_news_index.py
          python fetchers/fetch_th_patch_index.py
          python scanners/scan_kr_digimon_releases.py
          python scanners/scan_th_patch_digimon.py
          python enrichers/enrich_digimon_kr.py
          python enrichers/enrich_digimon_th.py
          python enrichers/enrich_digimon_gameking.py
          python builders/build_digimon_html.py

      - name: Validate before proposing changes
        run: python tools/validate.py --no-build

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: scheduled data refresh"
          title: "Data refresh"
          body: |
            Automated refresh of the cloud-safe pipeline (seal tables + KR/TH
            digimon references). Review the diff before merging — Pages
            publishes from `main`.

            Not included (run locally): `scan_digimon.py`, attribute enrichment
            (CDP), and image extraction.
          branch: auto/data-refresh
          delete-branch: true
          add-paths: |
            data/
            docs/
